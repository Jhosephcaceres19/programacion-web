
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Diavox convierte tus ideas en presentaciones visuales."
    >

    <title>Diavox | Crea presentaciones</title>

    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Estilos -->
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <main class="hero">
        <section class="hero__content" aria-labelledby="hero-title">

            <span class="hero__eyebrow">
                TUS IDEAS, MEJOR PRESENTADAS
            </span>

            <h1 class="hero__title" id="hero-title">
                Bienvenido a Web Slides Diavox
            </h1>

            <p class="hero__description">
                Transforma tus ideas en presentaciones visuales
                claras, atractivas y profesionales.
            </p>

            <div class="editor">
                <label class="editor__label" for="presentation-content">
                    ¿Qué presentación quieres crear?
                </label>

                <textarea
                    class="editor__textarea"
                    id="presentation-content"
                    name="presentation-content"
                    placeholder="Escribe o pega aquí el contenido de tu presentación..."
                    rows="8"
                ></textarea>

                <div class="editor__footer">
                    <span class="editor__hint">
                        Escribe tus ideas en texto plano o Markdown.
                    </span>

                    <span class="editor__format">
                        TXT / MD
                    </span>
                </div>
            </div>

        </section>
    </main>
</body>
</html>
